<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo | Portfólio</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --panel: #121316;
        --panel-alt: #171a1f;
        --text: #f5f5f5;
        --muted: #9ca3af;
        --accent: #8c1c31;
        --border: rgba(255,255,255,0.08);
        --success: #166534;
        --danger: #b91c1c;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 80px;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin-bottom: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.5fr);
        gap: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }

      label {
        display: block;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      input,
      textarea,
      select,
      button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        padding: 12px 14px;
        font-size: 1rem;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        cursor: pointer;
        background: var(--accent);
        border: none;
        font-weight: 600;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
      }

      .checkbox-row input {
        width: auto;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 12px 10px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .row-action {
        display: inline-block;
        width: auto;
        margin: 0 6px 6px 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255,255,255,0.05);
      }

      .row-action.publish {
        background: var(--success);
      }

      .row-action.danger {
        background: var(--danger);
      }

      .status {
        margin-top: 16px;
        min-height: 24px;
        color: var(--muted);
      }

      .empty {
        color: var(--muted);
        padding-top: 12px;
      }

      @media (max-width: 800px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <h1>Painel administrativo</h1>

      <div class="grid">
        <section class="panel">
          <h2>Novo conteúdo</h2>

          <form id="content-form">
            <input type="hidden" name="id" id="id" />

            <label>
              Tipo
              <select name="type" id="type">
                <option value="project">Projeto</option>
                <option value="achievement">Conquista</option>
                <option value="certificate">Certificado</option>
              </select>
            </label>

            <label>
              Título
              <input type="text" name="title" id="title" placeholder="Título do projeto" />
            </label>

            <label>
              Descrição
              <textarea name="description" id="description" placeholder="Descrição detalhada..."></textarea>
            </label>

            <div class="row">
              <label>
                GitHub
                <input type="url" name="github_url" id="github_url" placeholder="https://github.com/..." />
              </label>

              <label>
                Live/demo
                <input type="url" name="live_url" id="live_url" placeholder="https://..." />
              </label>
            </div>

            <label>
              Imagem
              <input type="url" name="image_url" id="image_url" placeholder="https://.../imagem.jpg" />
            </label>

            <div class="row">
              <label>
                Status
                <select name="status" id="status">
                  <option value="draft">Rascunho</option>
                  <option value="approved">Aprovado</option>
                  <option value="published">Publicado</option>
                  <option value="failed">Falhou</option>
                </select>
              </label>

              <div class="checkbox-row">
                <input type="checkbox" name="featured" id="featured" />
                <label for="featured">Destacar no portfólio</label>
              </div>
            </div>

            <button type="submit">Salvar conteúdo</button>
          </form>

          <div id="status-box" class="status"></div>
        </section>

        <section class="panel">
          <h2>Conteúdo publicado</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Tipo</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="content-table-body"></tbody>
            </table>
          </div>

          <div id="empty-state" class="empty">Nenhum item cadastrado ainda.</div>
        </section>
      </div>
    </div>

    <script src="./js/admin.js"></script>
  </body>
</html>
